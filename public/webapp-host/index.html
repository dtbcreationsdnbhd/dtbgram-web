<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mini App</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="root">
    <header id="header">
      <button id="backBtn" type="button" class="iconBtn" hidden aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </button>
      <div id="title" class="title">Mini App</div>
      <button id="closeBtn" type="button" class="iconBtn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </header>
    <main id="content">
      <iframe id="frame" title="Mini App" allow="camera; microphone; geolocation; clipboard-write; autoplay"></iframe>
      <div id="fallback" class="fallback" hidden>
        <p id="fallbackText"></p>
        <button id="fallbackAction" type="button" class="primaryBtn"></button>
      </div>
    </main>
    <footer id="bottomBar" hidden>
      <button id="mainButton" type="button" class="mainButton"></button>
    </footer>
  </div>
  <script src="./index.js"></script>
</body>
</html>
